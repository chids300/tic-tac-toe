<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
        <script src="index.js" defer="true"></script>
    </head>

    <body>
        <div id="header">
            <h1>ultimate tic tac toe</h1>
        </div>

        <hr>

        <div id="status-bar">
            <p id="status-text"></p>
            <p id="round-status">hello world</p>
        </div>
            
        </p>

        <div id="board">
        </div>

        <div id="config-bar">
            <button id="restart-btn" onclick="window.location.reload()">restart game</button>

            <div id="round-container">
                <label for="round-select">Number of rounds</label>
                <select name="numRounds" id="round-select">
                    <option value="1"> 1</option>
                    <option value="2"> 2</option>
                    <option value="3"> 3</option>
                    <option value="4"> 4</option>
                </select>
            </div>
        </div>

        <div id="round-info">
            <div id="round-scores">
                <h2>Round Winners:</h2>
            </div>
        </div>
    </body>
</html>
