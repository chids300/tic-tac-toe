<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
        <script src="index.js" defer="true"></script>
    </head>

    <body>

        <div id="overlay">
            <div id='config-container' class="column-container">
                <div>
                    <label for="round-select">Number of rounds</label>
                    <select name="numRounds" id="round-select">
                        <option value="1"> 1</option>
                        <option value="2"> 2</option>
                        <option value="3"> 3</option>
                        <option value="4"> 4</option>
                    </select>
                </div>
                
                <div class="column-container" id="grid-width-container">
                    <label for="grid-width">Number of columns/rows</label>
                    <input id='gridWidth' name="grid-width" type="number" value="3"/>
                </div>

                <div class="column-container" id="win-amount-container">
                    <label for="win-count">Amount needed in a row to win</label>
                    <input id="winAmount" name="win-count" type="number" value="3"/>
                </div>


                <button id="save-config">continue</button>

            </div>
        </div>

        <div id="header">
            <h1>ultimate tic tac toe</h1>
        </div>

        <hr>

        <div id="status-bar">
            <p id="status-text"></p>
            <p id="round-status">hello world</p>
        </div>
            
        </p>

        <div id="board">
        </div>

        <div id="round-info">
            <div id="round-scores">
                <h2>Round Winners:</h2>
            </div>
        </div>

        <div id="config-bar">
            <button id="restart-btn" onclick="window.location.reload()">restart game</button>
        </div>

    </body>
</html>
